<html>

<head>
  <title>Handling of http get and post request</title>
  <style>
    div {
      width: 400px;
      border: 1px solid green;
      padding: 10px;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

  <div>
    <h1>Create To-Do Item</h1>
    <form method="POST" action="{{ url_for('create_item') }}">
      <input type="text" name="itemname" placeholder="itemname">
      <button type="submit">submit</button>
    </form>
  </div>
  <div>
    <h1>Read To-Do Item</h1>
    <form method="POST" action="{{ url_for('read_item') }}">
      <input type="text" name="itemname" placeholder="itemname">
      <button type="submit">submit</button>
    </form>
  </div>

  
</body>

</html>
